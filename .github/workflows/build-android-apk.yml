name: Build Qwen3-ASR 1.7B Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Build release APK (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/QwenASR-1.7B-android-build-ready (1).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Could not find $ZIP_FILE in the repository root."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"
          test -d "$GITHUB_WORKSPACE/source/QwenASR-main"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/QwenASR-main" >> "$GITHUB_ENV"

      - name: Bump AGP to 9.1.1
        run: |
          F="$PROJECT_DIR/flutter/qwen_asr/example/android/settings.gradle.kts"
          sed -i -E 's/(id\("com\.android\.application"\) version ")[0-9.]+(")/\19.1.1\2/' "$F"
          grep -n "com.android.application" "$F"
        shell: bash

      - name: Migrate Android build files to AGP 9
        run: |
          cd "$PROJECT_DIR/flutter/qwen_asr/example/android"
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.clothpath.qwen_asr_example"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.clothpath.qwen_asr_example"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          flutter {
              source = "../.."
          }
          EOT
          sed -i '/^android.newDsl=false/d;/^android.builtInKotlin=false/d' gradle.properties
          printf '\nandroid.builtInKotlin=true\n' >> gradle.properties
          sed -i '/org.jetbrains.kotlin.android/d' settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Generate missing Gradle wrapper files
        run: |
          mkdir -p /tmp/gradle-wrapper-project
          printf "rootProject.name = 'wrapper-generator'\n" > /tmp/gradle-wrapper-project/settings.gradle
          : > /tmp/gradle-wrapper-project/build.gradle
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd /tmp/gradle-wrapper-project
          /tmp/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1 --distribution-type all
          ANDROID_DIR="$PROJECT_DIR/flutter/qwen_asr/example/android"
          mkdir -p "$ANDROID_DIR/gradle/wrapper"
          cp gradlew gradlew.bat "$ANDROID_DIR/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$ANDROID_DIR/gradle/wrapper/"
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Accept Android licenses through Flutter
        run: yes | flutter doctor --android-licenses >/dev/null || true

      - name: Resolve Flutter dependencies
        working-directory: ${{ github.workspace }}/source/QwenASR-main/flutter/qwen_asr/example
        run: flutter pub get

      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.11.1-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version 2.11.1 --locked

      - name: Regenerate Flutter-Rust bindings
        working-directory: ${{ github.workspace }}/source/QwenASR-main/flutter/qwen_asr
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Patch plugins for built-in Kotlin
        run: |
          for f in $(grep -rlE "kotlin-android|org\.jetbrains\.kotlin\.android" \
              "$PROJECT_DIR/flutter/qwen_asr/android" "$PUB_CACHE/hosted" \
              --include=build.gradle --include=build.gradle.kts 2>/dev/null); do
            echo "Patching $f"
            sed -i -E '/kotlin-android|org\.jetbrains\.kotlin\.android/d' "$f"
            perl -0pi -e 's/\n[ \t]*kotlinOptions[ \t]*\{[^}]*\}//g' "$f"
          done

      - name: Patch cargokit for Gradle 9
        run: |
          for f in $(find "$PROJECT_DIR" "$PUB_CACHE/hosted" -path "*cargokit/gradle/plugin.gradle" 2>/dev/null); do
            echo "Patching $f"
            grep -q "org.gradle.process.ExecOperations" "$f" || \
              sed -i '1i import javax.inject.Inject\nimport org.gradle.process.ExecOperations' "$f"
            perl -0pi -e 's/(?:abstract\s+)?class\s+CargoKitBuildTask(\s+extends\s+\w+)?\s*\{/abstract class CargoKitBuildTask$1 {\n    \@Inject\n    abstract ExecOperations getExecOperations()\n/; s/\bproject\.exec\s*\{/getExecOperations().exec {/g; s/(?<![\w.])exec\s*\{/getExecOperations().exec {/g' "$f"
          done

      - name: Isolate Rust crate from repo workspace
        run: printf '\n[workspace]\n' >> "$PROJECT_DIR/flutter/qwen_asr/rust/Cargo.toml"

      - name: Build release APK
        working-directory: ${{ github.workspace }}/source/QwenASR-main/flutter/qwen_asr/example
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenASR-arm64-release-apk
          path: ${{ github.workspace }}/source/QwenASR-main/flutter/qwen_asr/example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
