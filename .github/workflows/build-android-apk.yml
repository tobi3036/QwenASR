name: Build Qwen3-ASR 1.7B Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QwenASR-1.7B-android-build-ready.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build release APK (Android ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          ZIP_FILE="QwenASR-1.7B-android-build-ready.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Could not find $ZIP_FILE in the repository root."
            echo "Files currently in the repository root:"
            ls -la
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"
          test -d "$GITHUB_WORKSPACE/source/QwenASR-main"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/QwenASR-main" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's legacy default package list. The old
          # standalone "tools" package is no longer available from Google.
          packages: |
            platform-tools
            platforms;android-36

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Generate missing Gradle wrapper files
        run: |
          mkdir -p /tmp/gradle-wrapper-project
          printf "rootProject.name = 'wrapper-generator'\n" > /tmp/gradle-wrapper-project/settings.gradle
          : > /tmp/gradle-wrapper-project/build.gradle
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd /tmp/gradle-wrapper-project
          /tmp/gradle-8.14/bin/gradle wrapper --gradle-version 8.14 --distribution-type all
          ANDROID_DIR="$PROJECT_DIR/flutter/qwen_asr/example/android"
          mkdir -p "$ANDROID_DIR/gradle/wrapper"
          cp gradlew gradlew.bat "$ANDROID_DIR/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$ANDROID_DIR/gradle/wrapper/"
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null || true

      - name: Resolve Flutter dependencies
        working-directory: source/QwenASR-main/flutter/qwen_asr/example
        run: flutter pub get

      - name: Build release APK
        working-directory: source/QwenASR-main/flutter/qwen_asr/example
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-1.7b-android-arm64
          path: source/QwenASR-main/flutter/qwen_asr/example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
